<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>亞灣工務所公告</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    #bulletin-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.7);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bulletin-content {
      background-color: white;
      width: 90%;
      max-width: 600px;
      max-height: 80%;
      border-radius: 10px;
      padding: 20px;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .bulletin-header {
      text-align: center;
      border-bottom: 2px solid #3e9956;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .bulletin-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
      color: #888;
    }

    .bulletin-entry {
      background-color: #f9f9f9;
      border-left: 5px solid #3e9956;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    .bulletin-entry:hover {
      transform: translateX(10px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .loading {
      text-align: center;
      color: #3e9956;
      padding: 20px;
      font-size: 18px;
    }

    .entry-title {
      font-weight: bold;
      color: #2c7a3f;
      margin-bottom: 10px;
    }

    .entry-content {
      color: #333;
      margin-bottom: 10px;
    }

    .entry-date {
      color: #888;
      text-align: right;
      font-size: 0.8em;
    }
  </style>
</head>
<body>
  <div id="bulletin-modal">
    <div class="bulletin-content">
      <span class="bulletin-close" onclick="closeBulletinModal()">&times;</span>
      <div class="bulletin-header">
        <h2>📢 亞灣工務所 公告欄</h2>
      </div>
      
      <div id="bulletin-entries" class="loading">
        載入公告中...
      </div>
    </div>
  </div>

  <script>
    // Google試算表的公開發佈CSV網址
    const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRC4HgLq2IE7lKm4lixBvo0X4f6Erl6JdW6prqkrr83AypmGiwfnUCyCFXcoN_KfNbGCvUu5u6vHXp5/pub?output=csv';

    // 頁面載入時直接獲取公告
    document.addEventListener('DOMContentLoaded', fetchBulletinEntries);

    function closeBulletinModal() {
      window.close(); // 直接關閉視窗
    }

    async function fetchBulletinEntries() {
      try {
        const response = await fetch(SPREADSHEET_CSV_URL);
        const csvText = await response.text();

        Papa.parse(csvText, {
          complete: function(results) {
            const entriesContainer = document.getElementById('bulletin-entries');
            entriesContainer.innerHTML = ''; // 清空載入提示

            // 跳過標題列，從第二列開始
            results.data.slice(1).forEach(entry => {
              // 確保每一列都有足夠的元素
              if (entry[0] && entry[0].trim() !== '') {
                const entryDiv = document.createElement('div');
                entryDiv.className = 'bulletin-entry';
                
                const icon = entry[3] || '📢';
                const title = entry[0] || '公告';
                const content = entry[1] || '暫無詳細內容';
                const date = entry[2] || '';

                entryDiv.innerHTML = `
                  <div class="entry-title">${icon} ${title}</div>
                  <div class="entry-content">${content}</div>
                  <div class="entry-date">${date}</div>
                `;
                
                entriesContainer.appendChild(entryDiv);
              }
            });

            // 如果沒有公告
            if (entriesContainer.children.length === 0) {
              entriesContainer.innerHTML = `
                <div style="text-align:center; color:#888;">
                  目前尚無公告
                </div>
              `;
            }
          },
          error: function(error) {
            console.error('CSV解析錯誤:', error);
            const entriesContainer = document.getElementById('bulletin-entries');
            entriesContainer.innerHTML = `
              <div style="color:red; text-align:center;">
                <h3>🚨 CSV解析錯誤</h3>
                <p>${error.message}</p>
              </div>
            `;
          }
        });

      } catch (error) {
        const entriesContainer = document.getElementById('bulletin-entries');
        entriesContainer.innerHTML = `
          <div style="color:red; text-align:center;">
            <h3>🚨 載入錯誤</h3>
            <p>${error.message}</p>
          </div>
        `;
        console.error('公告載入失敗:', error);
      }
    }
  </script>
</body>
</html>
