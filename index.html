<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>永青營造施工進度管理系統</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft JhengHei','Segoe UI',Arial,sans-serif; background:#e8eaf0; padding:15px; font-size:14px; }
    .header { background:#2c3e50; color:white; padding:20px 25px; margin-bottom:20px; border-left:5px solid #e74c3c; }
    .header h1 { font-size:22px; margin-bottom:5px; font-weight:600; }
    .header p { opacity:.85; font-size:13px; }
    .header-controls { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-top:15px; padding-top:15px; border-top:1px solid rgba(255,255,255,.2); }
    .sync-status { background:rgba(255,255,255,.15); padding:6px 12px; border-radius:3px; font-size:12px; display:flex; align-items:center; gap:6px; }
    .sync-indicator { width:8px; height:8px; border-radius:50%; background:#2ecc71; }
    .lock-status { background:rgba(255,255,255,.15); padding:6px 12px; border-radius:3px; font-size:12px; display:flex; align-items:center; gap:6px; }
    .btn { padding:8px 16px; border:none; border-radius:3px; font-size:13px; cursor:pointer; transition:all .2s; font-weight:500; }
    .btn-primary { background:#3498db; color:white; } .btn-primary:hover { background:#2980b9; }
    .btn-success { background:#27ae60; color:white; } .btn-success:hover { background:#229954; }
    .btn-warning { background:#f39c12; color:white; } .btn-warning:hover { background:#e67e22; }
    .btn-danger  { background:#e74c3c; color:white; } .btn-danger:hover  { background:#c0392b; }
    .building-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
    .building-tab { padding:15px; background:white; border:2px solid #ddd; border-radius:3px; text-align:center; cursor:pointer; transition:all .2s; font-size:16px; font-weight:600; }
    .building-tab:hover { border-color:#3498db; }
    .building-tab.active { background:#34495e; color:white; border-color:#34495e; }
    .building-tab .progress-text { font-size:20px; margin-top:5px; font-weight:700; }
    .controls { background:white; padding:15px; margin-bottom:20px; border-left:3px solid #3498db; display:flex; gap:15px; flex-wrap:wrap; align-items:center; }
    .controls label { font-weight:600; color:#2c3e50; font-size:13px; }
    .controls select,.controls input { padding:6px 12px; border:1px solid #ccc; border-radius:3px; font-size:13px; outline:none; }
    .controls select:focus,.controls input:focus { border-color:#3498db; }
    .stats-container { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:15px; margin-bottom:20px; }
    .stat-card { background:white; padding:15px; border-left:4px solid #3498db; }
    .stat-card h3 { color:#7f8c8d; font-size:12px; margin-bottom:8px; font-weight:600; text-transform:uppercase; }
    .stat-card .number { font-size:28px; font-weight:700; color:#2c3e50; }
    .progress-bar { width:100%; height:6px; background:#ecf0f1; margin-top:8px; overflow:hidden; }
    .progress-fill { height:100%; background:#3498db; transition:width .3s; }
    .units-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:15px; margin-bottom:30px; }
    .unit-card { background:white; padding:15px; border-left:4px solid #95a5a6; transition:all .2s; }
    .unit-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.1); }
    .unit-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #ecf0f1; }
    .unit-title { font-size:15px; font-weight:600; color:#2c3e50; }
    .unit-progress { font-size:18px; font-weight:700; color:#3498db; }
    .checklist { list-style:none; }
    .checklist li { padding:10px 0; border-bottom:1px solid #f5f5f5; }
    .checklist li:last-child { border-bottom:none; }
    .item-row { display:flex; flex-direction:column; gap:6px; }
    .item-name { font-weight:500; color:#34495e; font-size:13px; }
    .item-controls { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .percentage-select,.inspection-select { flex:1; min-width:80px; padding:5px 8px; border:1px solid #ddd; border-radius:2px; font-size:12px; font-weight:600; cursor:pointer; outline:none; transition:all .2s; background:white; }
    .percentage-select.complete { background:#d4edda; border-color:#28a745; color:#155724; }
    .percentage-select.progress  { background:#fff3cd; border-color:#ffc107; color:#856404; }
    .percentage-select.pending   { background:#f8d7da; border-color:#dc3545; color:#721c24; }
    .inspection-select.inspected     { background:#cfe2ff; border-color:#0d6efd; color:#084298; }
    .inspection-select.not-inspected { background:#f8f9fa; border-color:#adb5bd; color:#6c757d; }
    .percentage-select:disabled,.inspection-select:disabled { opacity:.6; cursor:not-allowed; }

    /* ── 照片區（大項層級，顯示於 card 底部）── */
    .photo-section { margin-top:12px; padding-top:10px; border-top:1px dashed #dee2e6; }
    .photo-section-label { font-size:11px; font-weight:700; color:#95a5a6; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
    .photo-upload-btn { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; background:#f0f4ff; border:1px dashed #3498db; border-radius:3px; font-size:11px; color:#3498db; cursor:pointer; transition:all .2s; font-weight:600; user-select:none; }
    .photo-upload-btn:hover { background:#dce8ff; }
    .photo-upload-btn.locked { opacity:.5; cursor:not-allowed; pointer-events:none; }
    .photo-thumbnails { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .photo-thumb-wrap { position:relative; width:64px; height:64px; border-radius:4px; overflow:hidden; border:1px solid #ddd; cursor:pointer; transition:transform .15s; }
    .photo-thumb-wrap:hover { transform:scale(1.06); box-shadow:0 2px 6px rgba(0,0,0,.2); }
    .photo-thumb-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
    .photo-thumb-del { position:absolute; top:2px; right:2px; width:18px; height:18px; background:rgba(231,76,60,.9); color:white; border:none; border-radius:50%; font-size:10px; line-height:18px; text-align:center; cursor:pointer; display:none; font-weight:700; }
    .photo-thumb-wrap:hover .photo-thumb-del { display:block; }
    .photo-count { display:inline-block; background:#3498db; color:white; border-radius:10px; font-size:10px; padding:1px 7px; font-weight:600; margin-left:4px; }
    .photo-uploading { display:inline-flex; align-items:center; gap:6px; font-size:11px; color:#7f8c8d; margin-top:6px; }
    .spinner { width:12px; height:12px; border:2px solid #ddd; border-top-color:#3498db; border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .status-badge { display:inline-block; padding:3px 10px; border-radius:2px; font-size:11px; font-weight:600; margin-top:5px; text-transform:uppercase; letter-spacing:.5px; }
    .status-complete { background:#28a745; color:white; }
    .status-progress { background:#ffc107; color:#000; }
    .status-pending  { background:#dc3545; color:white; }
    .floor-section { margin-bottom:30px; }
    .floor-title { font-size:18px; font-weight:700; color:#2c3e50; margin-bottom:15px; padding:12px 15px; background:white; border-left:5px solid #e74c3c; }
    .last-update { font-size:10px; color:#95a5a6; margin-top:5px; }

    /* ── 燈箱 ── */
    .lightbox { display:none; position:fixed; z-index:2000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,.88); justify-content:center; align-items:center; flex-direction:column; gap:14px; }
    .lightbox.show { display:flex; }
    .lightbox-img-wrap { max-width:90vw; max-height:78vh; display:flex; align-items:center; justify-content:center; }
    .lightbox-img-wrap img { max-width:90vw; max-height:78vh; border-radius:4px; box-shadow:0 4px 24px rgba(0,0,0,.6); object-fit:contain; }
    .lightbox-close { position:absolute; top:18px; right:24px; color:white; font-size:34px; cursor:pointer; font-weight:700; line-height:1; z-index:10; }
    .lightbox-nav { display:flex; gap:16px; align-items:center; }
    .lightbox-nav button { background:rgba(255,255,255,.18); border:none; color:white; padding:8px 20px; border-radius:3px; cursor:pointer; font-size:14px; font-weight:600; }
    .lightbox-nav button:hover { background:rgba(255,255,255,.32); }
    .lightbox-counter { color:rgba(255,255,255,.7); font-size:13px; min-width:60px; text-align:center; }
    .lightbox-bottom { display:flex; align-items:center; gap:12px; }
    .lightbox-info { color:rgba(255,255,255,.65); font-size:12px; }
    .lightbox-drive-link { color:#74b9ff; font-size:12px; text-decoration:none; padding:4px 10px; border:1px solid rgba(116,185,255,.4); border-radius:3px; }
    .lightbox-drive-link:hover { background:rgba(116,185,255,.15); }

    /* Modal */
    .modal { display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,.6); }
    .modal-content { background:white; margin:10% auto; padding:25px; width:90%; max-width:400px; }
    .modal-header { display:flex; align-items:center; gap:10px; margin-bottom:20px; padding-bottom:15px; border-bottom:2px solid #e74c3c; }
    .modal-header.success { border-bottom-color:#27ae60; color:#27ae60; }
    .modal-header h2 { font-size:18px; margin:0; font-weight:600; }
    .modal-body { margin-bottom:20px; }
    .modal-body p { color:#555; margin-bottom:15px; line-height:1.6; font-size:13px; }
    .modal-body input { width:100%; padding:10px; border:1px solid #ddd; border-radius:3px; font-size:14px; outline:none; }
    .modal-body input:focus { border-color:#3498db; }
    .modal-footer { display:flex; gap:10px; justify-content:flex-end; }
    .error-message { color:#e74c3c; font-size:13px; margin-top:10px; display:none; font-weight:600; }
    .highlight { background:#fff176; border-radius:2px; padding:0 1px; }

    @media (max-width:768px) {
      .units-grid { grid-template-columns:1fr; }
      .building-tabs { grid-template-columns:1fr; }
      .item-controls { flex-direction:column; }
      .percentage-select,.inspection-select { width:100%; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>南一處-亞灣工務所 製</h1>
  <p>前鎮亞灣智慧公宅(第一期)新建統包工程</p>
  <div class="header-controls">
    <div style="display:flex;gap:10px;align-items:center;">
      <div class="sync-status"><div class="sync-indicator"></div><span id="syncStatus">已連線</span></div>
      <div class="lock-status"><span id="lockStatus">唯讀模式</span></div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-warning" id="unlockBtn" onclick="showUnlockModal()">解除鎖定</button>
      <button class="btn btn-danger" onclick="showPasswordModal()">初始化數據</button>
      <button class="btn btn-primary" onclick="refreshData()">重新整理</button>
    </div>
  </div>
</div>

<div id="passwordModal" class="modal">
  <div class="modal-content">
    <div class="modal-header"><h2>初始化確認</h2></div>
    <div class="modal-body">
      <p><strong>警告：此操作將清除所有現有數據！</strong></p>
      <p>請輸入管理員密碼以繼續：</p>
      <input type="password" id="passwordInput" placeholder="請輸入密碼" onkeypress="handlePasswordKeypress(event)">
      <div class="error-message" id="errorMessage">密碼錯誤，請重試</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closePasswordModal()">取消</button>
      <button class="btn btn-danger" onclick="verifyPassword()">確認初始化</button>
    </div>
  </div>
</div>

<div id="unlockModal" class="modal">
  <div class="modal-content">
    <div class="modal-header success"><h2>編輯權限驗證</h2></div>
    <div class="modal-body">
      <p>請輸入編輯密碼以解除鎖定：</p>
      <input type="password" id="unlockPasswordInput" placeholder="請輸入編輯密碼" onkeypress="handleUnlockKeypress(event)">
      <div class="error-message" id="unlockErrorMessage">密碼錯誤，請重試</div>
      <p style="font-size:11px;color:#7f8c8d;margin-top:10px;">提示：解鎖後 30 分鐘內可編輯，逾時自動鎖定</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeUnlockModal()">取消</button>
      <button class="btn btn-success" onclick="verifyUnlock()">解除鎖定</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">✕</span>
  <div class="lightbox-img-wrap"><img id="lightboxImg" src="" alt="照片預覽"></div>
  <div class="lightbox-nav">
    <button onclick="lightboxPrev()">◀ 上一張</button>
    <span class="lightbox-counter" id="lightboxCounter"></span>
    <button onclick="lightboxNext()">下一張 ▶</button>
  </div>
  <div class="lightbox-bottom">
    <span class="lightbox-info" id="lightboxInfo"></span>
    <a id="lightboxDriveLink" class="lightbox-drive-link" href="#" target="_blank">在 Drive 中開啟 ↗</a>
  </div>
</div>

<div id="mainContent">
  <div class="building-tabs">
    <div class="building-tab active" data-building="A棟" onclick="switchBuilding('A棟')"><div>A棟</div><div class="progress-text" id="progressA">0%</div></div>
    <div class="building-tab" data-building="B棟" onclick="switchBuilding('B棟')"><div>B棟</div><div class="progress-text" id="progressB">0%</div></div>
    <div class="building-tab" data-building="C棟" onclick="switchBuilding('C棟')"><div>C棟</div><div class="progress-text" id="progressC">0%</div></div>
  </div>
  <div class="controls">
    <label>樓層</label>
    <select id="floorFilter" onchange="filterUnits()">
      <option value="all">全部</option>
      <option value="RF">RF</option>
      <option value="14F">14F</option><option value="13F">13F</option><option value="12F">12F</option>
      <option value="11F">11F</option><option value="10F">10F</option><option value="9F">9F</option>
      <option value="8F">8F</option><option value="7F">7F</option><option value="6F">6F</option>
      <option value="5F">5F</option><option value="4F">4F</option><option value="3F">3F</option>
      <option value="2F">2F</option><option value="1F">1F</option><option value="B1F">B1F</option>
    </select>
    <label>項目類別</label>
    <select id="categoryFilter" onchange="filterUnits()">
      <option value="all">全部</option>
      <option value="室內泥作">室內泥作</option><option value="油漆">油漆</option>
      <option value="輕隔間">輕隔間</option><option value="防水工程">防水工程</option>
      <option value="地坪">地坪</option><option value="門窗">門窗</option>
      <option value="衛浴">衛浴</option><option value="外牆泥作">外牆泥作</option>
      <option value="外牆塗料">外牆塗料</option><option value="雜項">雜項</option>
      <option value="清潔">清潔</option>
    </select>
    <label>狀態</label>
    <select id="statusFilter" onchange="filterUnits()">
      <option value="all">全部</option>
      <option value="complete">已完成</option>
      <option value="progress">進行中</option>
      <option value="pending">未開始</option>
    </select>
    <label>搜尋</label>
    <input type="text" id="searchUnit" placeholder="輸入關鍵字..." oninput="filterUnits()">
  </div>
  <div class="stats-container">
    <div class="stat-card"><h3>完成率</h3><div class="number" id="currentProgress">0%</div><div class="progress-bar"><div class="progress-fill" id="currentProgressBar"></div></div></div>
    <div class="stat-card"><h3>已完成</h3><div class="number" id="completedItems">0</div></div>
    <div class="stat-card"><h3>進行中</h3><div class="number" id="progressItems">0</div></div>
    <div class="stat-card"><h3>總項目</h3><div class="number" id="totalItems">0</div></div>
  </div>
  <div id="unitsContainer"></div>
</div>

<script>
  const scriptUrl     = 'https://script.google.com/macros/s/AKfycbwJejVgtbQUUxJC8sYx2bC1k-nKUFkanrBswL2TSXUdCdCUT5Dn3SQQaulXcaScM7AW1Q/exec';
  const adminPassword = 'a03751';
  const editPasswords = ['a00001','a00002','a00003','edit123'];

  let allData         = [];
  let currentBuilding = 'A棟';
  let isUnlocked      = false;
  let unlockTimer     = null;

  // ★ 照片快取 key = building||floor||category（大項）
  const photoCache  = {};
  const lightboxMap = {};
  let lightboxPhotos = [];
  let lightboxIndex  = 0;

  window.onload = function() { loadData(); setInterval(loadData,30000); checkUnlockStatus(); };

  // ════════════ 工具 ════════════
  // ★ key 以 category 為單位
  function photoKey(building, floor, category) {
    return building + '||' + floor + '||' + category;
  }
  function safeId(s) { return s.replace(/[^a-zA-Z0-9]/g,'_'); }
  function escJs(s)  { return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
  function hl(t,kw)  {
    if(!kw) return t;
    return t.replace(new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),
      m=>'<span class="highlight">'+m+'</span>');
  }

  // ════════════ 照片 API（統一傳 category）════════════
  async function fetchPhotos(building, floor, category) {
    if (!building||!floor||!category) return [];
    const k = photoKey(building, floor, category);
    try {
      const res = await fetch(scriptUrl, {
        method:'POST',
        body: JSON.stringify({ action:'getPhotos', building, floor, category })
      });
      const result = await res.json();
      if (result.success) {
        photoCache[k]          = result.photos || [];
        lightboxMap[safeId(k)] = photoCache[k];
      }
    } catch(e) { console.error('取得照片失敗',e); }
    return photoCache[k] || [];
  }

  async function uploadPhotoToDrive(building, floor, category, file) {
    if (!building||!floor||!category) throw new Error('building/floor/category 不能為空');
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = async function(ev) {
        try {
          const compressed = await compressImage(ev.target.result, 1200, 0.82);
          // ★ fileName 含完整資訊方便識別
          const fileName = building+'_'+floor+'_'+category+'_'+Date.now()+'.jpg';
          const res = await fetch(scriptUrl, {
            method:'POST',
            body: JSON.stringify({
              action:    'uploadPhoto',
              building:  building,
              floor:     floor,
              category:  category,   // ★ 傳 category，不傳 itemName
              fileName:  fileName,
              mimeType:  'image/jpeg',
              base64Data: compressed
            })
          });
          const result = await res.json();
          if (result.success) {
            const k = photoKey(building, floor, category);
            if (!photoCache[k]) photoCache[k] = [];
            photoCache[k].push({
              fileId:      result.fileId,
              fileName:    result.fileName,
              thumbUrl:    result.thumbUrl,
              viewUrl:     result.viewUrl,
              createdDate: new Date().toLocaleString('zh-TW')
            });
            lightboxMap[safeId(k)] = photoCache[k];
            resolve(result);
          } else reject(result.error);
        } catch(err) { reject(err); }
      };
      reader.readAsDataURL(file);
    });
  }

  async function deletePhotoFromDrive(building, floor, category, fileId, index) {
    try {
      const res    = await fetch(scriptUrl,{method:'POST',body:JSON.stringify({action:'deletePhoto',fileId})});
      const result = await res.json();
      if (result.success) {
        const k = photoKey(building,floor,category);
        if (photoCache[k]) { photoCache[k].splice(index,1); lightboxMap[safeId(k)]=photoCache[k]; }
        return true;
      }
    } catch(e) { console.error('刪除失敗',e); }
    return false;
  }

  function compressImage(dataURL, maxWidth, quality) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let w=img.width, h=img.height;
        if(w>maxWidth){ h=Math.round(h*maxWidth/w); w=maxWidth; }
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src = dataURL;
    });
  }

  // ════════════ 照片 UI（綁定在 category card 底部）════════════
  // ★ 用 data 屬性傳參，避免 onclick 字串特殊字元問題
  function handleUploadClick(el) {
    const b = el.dataset.building;
    const f = el.dataset.floor;
    const c = el.dataset.category;
    triggerPhotoUpload(b, f, c);
  }

  function triggerPhotoUpload(building, floor, category) {
    if (!isUnlocked) { alert('請先解除鎖定才能上傳照片'); return; }
    const id = 'fi_'+safeId(photoKey(building,floor,category));
    let input = document.getElementById(id);
    if (!input) {
      input = document.createElement('input');
      input.type='file'; input.accept='image/*'; input.multiple=true;
      input.id=id; input.style.display='none';
      // ★ 閉包綁定，不依賴字串傳值
      input.addEventListener('change', function() {
        handlePhotoFiles(building, floor, category, Array.from(this.files));
        this.value='';
      });
      document.body.appendChild(input);
    }
    input.click();
  }

  async function handlePhotoFiles(building, floor, category, files) {
    if (!files.length) return;
    const psId   = 'ps_'+safeId(photoKey(building,floor,category));
    const spinId = 'spin_'+safeId(photoKey(building,floor,category));
    const ps = document.getElementById(psId);
    if (ps) ps.insertAdjacentHTML('beforeend',
      '<div class="photo-uploading" id="'+spinId+'"><span class="spinner"></span> 上傳中 (0/'+files.length+')…</div>');
    let done = 0;
    for (const file of files) {
      try {
        await uploadPhotoToDrive(building, floor, category, file);
        done++;
        const el = document.getElementById(spinId);
        if (el) el.innerHTML='<span class="spinner"></span> 上傳中 ('+done+'/'+files.length+')…';
      } catch(e) {
        console.error('上傳失敗',e);
        alert('照片上傳失敗：'+e);
      }
    }
    refreshPhotoSection(building, floor, category);
  }

  function refreshPhotoSection(building, floor, category) {
    const psId = 'ps_'+safeId(photoKey(building,floor,category));
    const ps   = document.getElementById(psId);
    if (!ps) return;
    ps.innerHTML = buildPhotoHTML(building, floor, category);
  }

  function buildPhotoHTML(building, floor, category) {
    const k      = photoKey(building, floor, category);
    const photos = photoCache[k] || [];
    lightboxMap[safeId(k)] = photos;
    const locked = !isUnlocked;
    const badge  = photos.length > 0 ? '<span class="photo-count">'+photos.length+'</span>' : '';

    // ★ 上傳按鈕用 data-* 屬性，onclick 呼叫 handleUploadClick(this)
    let html = '<div class="photo-upload-btn'+(locked?' locked':'')+'"'
      +' data-building="'+escJs(building)+'"'
      +' data-floor="'+escJs(floor)+'"'
      +' data-category="'+escJs(category)+'"'
      +(locked?'':' onclick="handleUploadClick(this)"')
      +'>📷 上傳照片'+badge+'</div>'
      +'<div class="photo-thumbnails">';

    photos.forEach((p, idx) => {
      html += '<div class="photo-thumb-wrap"'
        +' onclick="openLightbox(\''+safeId(k)+'\','+idx+')"'
        +' title="'+escJs(p.fileName)+'">'
        +'<img src="'+p.thumbUrl+'" alt="照片'+(idx+1)+'" onerror="this.style.opacity=.3">';
      if (!locked) {
        html += '<button class="photo-thumb-del"'
          +' onclick="event.stopPropagation();confirmDel(\''+escJs(building)+'\',\''+escJs(floor)+'\',\''+escJs(category)+'\',\''+p.fileId+'\','+idx+')">✕</button>';
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  async function confirmDel(building, floor, category, fileId, index) {
    if (!confirm('確定要刪除這張照片？此操作無法復原。')) return;
    const ok = await deletePhotoFromDrive(building, floor, category, fileId, index);
    if (ok) refreshPhotoSection(building, floor, category);
    else alert('刪除失敗，請重試');
  }

  // ════════════ 燈箱 ════════════
  function openLightbox(safeKey, index) {
    const photos = lightboxMap[safeKey]||[];
    if (!photos.length) return;
    lightboxPhotos=photos; lightboxIndex=index;
    updateLightbox();
    document.getElementById('lightbox').classList.add('show');
  }
  function updateLightbox() {
    const p=lightboxPhotos[lightboxIndex];
    document.getElementById('lightboxImg').src=p.thumbUrl;
    document.getElementById('lightboxCounter').textContent=(lightboxIndex+1)+' / '+lightboxPhotos.length;
    document.getElementById('lightboxInfo').textContent=p.fileName||'';
    document.getElementById('lightboxDriveLink').href=p.viewUrl||'#';
  }
  function lightboxPrev(){ lightboxIndex=(lightboxIndex-1+lightboxPhotos.length)%lightboxPhotos.length; updateLightbox(); }
  function lightboxNext(){ lightboxIndex=(lightboxIndex+1)%lightboxPhotos.length; updateLightbox(); }
  function closeLightbox(){ document.getElementById('lightbox').classList.remove('show'); }

  // ════════════ 密碼/鎖定 ════════════
  function showPasswordModal(){ document.getElementById('passwordModal').style.display='block'; document.getElementById('passwordInput').value=''; document.getElementById('errorMessage').style.display='none'; setTimeout(()=>document.getElementById('passwordInput').focus(),100); }
  function closePasswordModal(){ document.getElementById('passwordModal').style.display='none'; }
  function handlePasswordKeypress(e){ if(e.key==='Enter') verifyPassword(); }
  function verifyPassword(){ if(document.getElementById('passwordInput').value===adminPassword){ closePasswordModal(); initializeData(); } else { document.getElementById('errorMessage').style.display='block'; document.getElementById('passwordInput').value=''; document.getElementById('passwordInput').focus(); } }
  function showUnlockModal(){ if(isUnlocked){ if(confirm('目前已解鎖，是否要重新鎖定？')) lockSystem(); return; } document.getElementById('unlockModal').style.display='block'; document.getElementById('unlockPasswordInput').value=''; document.getElementById('unlockErrorMessage').style.display='none'; setTimeout(()=>document.getElementById('unlockPasswordInput').focus(),100); }
  function closeUnlockModal(){ document.getElementById('unlockModal').style.display='none'; }
  function handleUnlockKeypress(e){ if(e.key==='Enter') verifyUnlock(); }
  function verifyUnlock(){ if(editPasswords.includes(document.getElementById('unlockPasswordInput').value)){ closeUnlockModal(); unlockSystem(); } else { document.getElementById('unlockErrorMessage').style.display='block'; document.getElementById('unlockPasswordInput').value=''; document.getElementById('unlockPasswordInput').focus(); } }
  function unlockSystem(){ isUnlocked=true; localStorage.setItem('constructionUnlockTime',new Date().getTime()); document.getElementById('lockStatus').textContent='編輯模式'; document.getElementById('unlockBtn').textContent='鎖定系統'; document.getElementById('unlockBtn').className='btn btn-danger'; renderCurrentBuilding(); if(unlockTimer) clearTimeout(unlockTimer); unlockTimer=setTimeout(()=>{ lockSystem(); alert('編輯時間已到，系統已自動鎖定'); },30*60*1000); }
  function lockSystem(){ isUnlocked=false; localStorage.removeItem('constructionUnlockTime'); document.getElementById('lockStatus').textContent='唯讀模式'; document.getElementById('unlockBtn').textContent='解除鎖定'; document.getElementById('unlockBtn').className='btn btn-warning'; renderCurrentBuilding(); if(unlockTimer){ clearTimeout(unlockTimer); unlockTimer=null; } }
  function checkUnlockStatus(){ const t=localStorage.getItem('constructionUnlockTime'); if(t){ const el=new Date().getTime()-parseInt(t); if(el<30*60*1000){ isUnlocked=true; document.getElementById('lockStatus').textContent='編輯模式'; document.getElementById('unlockBtn').textContent='鎖定系統'; document.getElementById('unlockBtn').className='btn btn-danger'; unlockTimer=setTimeout(()=>{ lockSystem(); alert('編輯時間已到，系統已自動鎖定'); },30*60*1000-el); } else lockSystem(); } }

  // ════════════ 資料 ════════════
  async function loadData(){
    try{
      document.getElementById('syncStatus').textContent='同步中...';
      const res=await fetch(scriptUrl);
      const result=await res.json();
      if(result.success){ allData=result.data; updateBuildingProgress(); renderCurrentBuilding(); document.getElementById('syncStatus').textContent='已同步 '+new Date().toLocaleTimeString(); }
    }catch(e){ document.getElementById('syncStatus').textContent='同步失敗'; }
  }
  async function initializeData(){
    try{ document.getElementById('syncStatus').textContent='初始化中...'; const res=await fetch(scriptUrl,{method:'POST',body:JSON.stringify({action:'initialize'})}); const result=await res.json(); if(result.success){ alert('初始化成功：'+result.message); loadData(); } else alert('初始化失敗：'+result.error); }catch(e){ alert('初始化失敗：'+e); }
  }

  // ════════════ 棟別 ════════════
  function switchBuilding(b){ currentBuilding=b; document.querySelectorAll('.building-tab').forEach(t=>t.classList.remove('active')); document.querySelector('[data-building="'+b+'"]').classList.add('active'); renderCurrentBuilding(); }
  function updateBuildingProgress(){ ['A棟','B棟','C棟'].forEach(b=>{ const bd=allData.filter(d=>d['棟別']===b); const avg=bd.length>0?Math.round(bd.reduce((s,i)=>s+(parseFloat(i['完成百分比'])||0),0)/bd.length):0; document.getElementById('progress'+b.charAt(0)).textContent=avg+'%'; }); }

  // ════════════ 渲染 ════════════
  function getPctClass(p){ return p===100?'complete':p>0?'progress':'pending'; }
  function getInsClass(s){ return (s&&s.includes('已查驗'))?'inspected':'not-inspected'; }

  function renderCurrentBuilding(){
    const floorF=document.getElementById('floorFilter').value;
    const catF  =document.getElementById('categoryFilter').value;
    const stF   =document.getElementById('statusFilter').value;
    const kw    =document.getElementById('searchUnit').value.trim().toLowerCase();

    let data=allData.filter(d=>d['棟別']===currentBuilding);
    if(floorF!=='all') data=data.filter(d=>d['樓層']===floorF);
    if(catF!=='all')   data=data.filter(d=>d['項目類別']===catF);
    if(kw) data=data.filter(d=>
      (d['樓層']||'').toLowerCase().includes(kw)||
      (d['項目類別']||'').toLowerCase().includes(kw)||
      (d['項目名稱']||'').toLowerCase().includes(kw)
    );

    const grouped={};
    data.forEach(item=>{
      const f=item['樓層'], c=item['項目類別'];
      if(!grouped[f]) grouped[f]={};
      if(!grouped[f][c]) grouped[f][c]=[];
      grouped[f][c].push(item);
    });

    const container=document.getElementById('unitsContainer');
    container.innerHTML='';
    const floors=['RF','14F','13F','12F','11F','10F','9F','8F','7F','6F','5F','4F','3F','2F','1F','B1F'];

    floors.forEach(floor=>{
      if(!grouped[floor]) return;
      const sec=document.createElement('div');
      sec.className='floor-section';
      sec.innerHTML='<div class="floor-title">'+hl(floor,kw)+'</div>';
      const grid=document.createElement('div');
      grid.className='units-grid';

      Object.keys(grouped[floor]).forEach(category=>{
        const items=grouped[floor][category];
        const avg=Math.round(items.reduce((s,i)=>s+(parseFloat(i['完成百分比'])||0),0)/items.length);
        const st=avg===100?'complete':avg>0?'progress':'pending';
        if(stF!=='all'&&st!==stF) return;

        const card=document.createElement('div');
        card.className='unit-card';

        // ── 細項清單（進度 + 查驗）──
        let listHtml='';
        items.forEach(item=>{
          const pct=parseFloat(item['完成百分比'])||0;
          const ins=item['查驗狀態']||'';
          const iVal=ins.includes('已查驗')?'inspected':'not-inspected';
          const dis=!isUnlocked?'disabled':'';
          const name=item['項目名稱'];
          listHtml+=`<li><div class="item-row">
            <div class="item-name">${hl(name,kw)}</div>
            <div class="item-controls">
              <select class="percentage-select ${getPctClass(pct)}"
                onchange="updateItemPercentage('${escJs(currentBuilding)}','${escJs(floor)}','${escJs(name)}',this.value)" ${dis}>
                <option value="0"   ${pct===0  ?'selected':''}>0%</option>
                <option value="20"  ${pct===20 ?'selected':''}>20%</option>
                <option value="40"  ${pct===40 ?'selected':''}>40%</option>
                <option value="60"  ${pct===60 ?'selected':''}>60%</option>
                <option value="80"  ${pct===80 ?'selected':''}>80%</option>
                <option value="100" ${pct===100?'selected':''}>100%</option>
              </select>
              <select class="inspection-select ${getInsClass(ins)}"
                onchange="updateInspectionStatus('${escJs(currentBuilding)}','${escJs(floor)}','${escJs(name)}',this.value)" ${dis}>
                <option value="not-inspected" ${iVal==='not-inspected'?'selected':''}>未查驗</option>
                <option value="inspected"     ${iVal==='inspected'    ?'selected':''}>已查驗</option>
              </select>
            </div>
          </div></li>`;
        });

        // ── ★ 照片區：以 category 為單位，放在 card 底部 ──
        const k    = photoKey(currentBuilding, floor, category);
        const psId = 'ps_'+safeId(k);
        if (!photoCache[k]) {
          photoCache[k]=[];
          // 非同步載入，完成後局部更新
          fetchPhotos(currentBuilding, floor, category)
            .then(()=>refreshPhotoSection(currentBuilding, floor, category));
        }

        const lu=items[0]['更新時間']||'';
        card.innerHTML=`
          <div class="unit-header">
            <div>
              <div class="unit-title">${hl(category,kw)}</div>
              <span class="status-badge status-${st}">${st==='complete'?'已完成':st==='progress'?'進行中':'未開始'}</span>
              ${lu?'<div class="last-update">'+lu+'</div>':''}
            </div>
            <div class="unit-progress">${avg}%</div>
          </div>
          <ul class="checklist">${listHtml}</ul>
          <div class="progress-bar"><div class="progress-fill" style="width:${avg}%"></div></div>
          <div class="photo-section">
            <div class="photo-section-label">📁 施工照片</div>
            <div id="${psId}">${buildPhotoHTML(currentBuilding, floor, category)}</div>
          </div>`;

        grid.appendChild(card);
      });

      sec.appendChild(grid);
      container.appendChild(sec);
    });

    updateStats(data);
  }

  // ════════════ API 更新 ════════════
  async function updateItemPercentage(building,floor,itemName,percentage){
    if(!isUnlocked){ alert('系統已鎖定，請先解除鎖定才能編輯'); renderCurrentBuilding(); return; }
    try{
      const pv=parseInt(percentage);
      const res=await fetch(scriptUrl,{method:'POST',body:JSON.stringify({action:'update',building,floor,itemName,percentage:pv})});
      const result=await res.json();
      if(result.success){ const item=allData.find(d=>d['棟別']===building&&d['樓層']===floor&&d['項目名稱']===itemName); if(item){ item['完成百分比']=pv; item['更新時間']=new Date().toLocaleString('zh-TW'); } updateBuildingProgress(); renderCurrentBuilding(); }
      else alert('更新失敗：'+result.error);
    }catch(e){ alert('更新失敗：'+e); }
  }
  async function updateInspectionStatus(building,floor,itemName,status){
    if(!isUnlocked){ alert('系統已鎖定，請先解除鎖定才能編輯'); renderCurrentBuilding(); return; }
    try{
      const ins=status==='inspected'?'已查驗':'';
      const res=await fetch(scriptUrl,{method:'POST',body:JSON.stringify({action:'updateRemark',building,floor,itemName,remark:ins})});
      const result=await res.json();
      if(result.success){ const item=allData.find(d=>d['棟別']===building&&d['樓層']===floor&&d['項目名稱']===itemName); if(item){ item['查驗狀態']=ins; item['更新時間']=new Date().toLocaleString('zh-TW'); } renderCurrentBuilding(); }
      else alert('更新查驗狀態失敗：'+result.error);
    }catch(e){ alert('更新查驗狀態失敗：'+e); }
  }

  // ════════════ 統計 ════════════
  function updateStats(data){
    const completed=data.filter(i=>parseFloat(i['完成百分比'])===100).length;
    const inProg=data.filter(i=>{ const p=parseFloat(i['完成百分比']); return p>0&&p<100; }).length;
    const avg=data.length>0?Math.round(data.reduce((s,i)=>s+(parseFloat(i['完成百分比'])||0),0)/data.length):0;
    document.getElementById('currentProgress').textContent=avg+'%';
    document.getElementById('currentProgressBar').style.width=avg+'%';
    document.getElementById('completedItems').textContent=completed;
    document.getElementById('progressItems').textContent=inProg;
    document.getElementById('totalItems').textContent=data.length;
  }
  function filterUnits(){ renderCurrentBuilding(); }
  function refreshData(){ loadData(); }

  window.onclick=function(e){
    if(e.target===document.getElementById('passwordModal')) closePasswordModal();
    if(e.target===document.getElementById('unlockModal'))   closeUnlockModal();
    if(e.target===document.getElementById('lightbox'))      closeLightbox();
  };
  document.addEventListener('keydown',e=>{
    if(!document.getElementById('lightbox').classList.contains('show')) return;
    if(e.key==='Escape')     closeLightbox();
    if(e.key==='ArrowLeft')  lightboxPrev();
    if(e.key==='ArrowRight') lightboxNext();
  });
</script>
</body>
</html>
